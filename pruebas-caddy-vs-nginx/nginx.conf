# nginx.conf — LO MISMO: servir un sitio por HTTPS y hacer de proxy inverso a un backend.
# ⛔ Ni una línea de más ni de menos que el Caddyfile.
events {}
http {
    server {
        listen 443 ssl;
        server_name sitio.local;
        ssl_certificate     /certs/sitio.crt;
        ssl_certificate_key /certs/sitio.key;
        root /sitio;
        location / {
            try_files $uri $uri/ =404;
        }
        location /api/ {
            proxy_pass http://backend:80/;
        }
    }
}
