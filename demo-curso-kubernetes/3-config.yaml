apiVersion: v1
kind: Pod
metadata:
  name: config
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "echo entorno=$ENTORNO; echo longitud de la clave=${#CLAVE}"]
      env:
        - name: ENTORNO
          valueFrom:
            configMapKeyRef:
              name: app
              key: ENTORNO
        - name: CLAVE
          valueFrom:
            secretKeyRef:
              name: db
              key: CLAVE
