apiVersion: v1
kind: Pod
metadata:
  name: colgado
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "touch /tmp/sano; sleep 15; rm /tmp/sano; sleep 600"]
      livenessProbe:
        exec:
          command: ["cat", "/tmp/sano"]
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 2
