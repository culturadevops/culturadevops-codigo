# TLS delante, dos réplicas detrás; `resolve` porque al recrear una réplica cambia de IP (curso de
# redes, lección 3) y reintento en la otra si una no contesta (curso de incidentes, incidente 4).
resolver 127.0.0.11 valid=1s;
upstream tienda {
  zone tienda 64k;
  server capstone-tienda-a:8000 resolve max_fails=1 fail_timeout=2s;
  server capstone-tienda-b:8000 resolve max_fails=1 fail_timeout=2s;
}
server {
  listen 443 ssl;
  server_name tienda.prod.test;
  ssl_certificate     /c/tienda.pem;
  ssl_certificate_key /c/tienda.key;
  location / {
    proxy_pass http://tienda;
    proxy_next_upstream error timeout http_502;
    proxy_next_upstream_tries 2;
  }
}
