global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/reglas.yml]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: grafana
    static_configs: [{targets: ["grafana:3000"]}]
  - job_name: pagos
    static_configs: [{targets: ["pagos:8080"]}]
