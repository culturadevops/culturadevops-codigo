events {}
http {
  upstream api {
    # round robin (por defecto)
    server 10.77.21.11:8000;
    server 10.77.21.12:8000;
    server 10.77.21.13:8000;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 1s;
    }
  }
}
