# Laboratorio del curso «Un incidente de principio a fin».
# El mismo stack que el curso de observabilidad (Prometheus 3.1, Loki 3.3, Alertmanager 0.28),
# más la tienda con sus interruptores de incidente y un Postgres con pg_stat_statements.
name: curso-incidentes

x-tienda: &tienda
  build: ./tienda
  environment: &entorno
    DSN: postgresql://admin:admin@db:5432/tienda
    LOKI: http://loki:3100/loki/api/v1/push
  depends_on: [loki, db]

services:
  tienda:
    <<: *tienda
    environment:
      <<: *entorno
      FUGA: ${FUGA:-0}
      CACHE_MAX: ${CACHE_MAX:-0}
    ports: ["127.0.0.1:18000:8000"]
    tmpfs:
      - /datos:size=2m          # el disco de la auditoría: pequeño a propósito (incidente 1)
    mem_limit: 160m             # incidente 2
    memswap_limit: 160m         # sin swap: Docker Desktop deja el doble por defecto y la fuga no revienta
    restart: unless-stopped

  db:
    image: postgres:17
    environment: {POSTGRES_USER: admin, POSTGRES_PASSWORD: admin, POSTGRES_DB: tienda}
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    cpus: 0.5                   # media CPU, como una instancia pequeña de la nube (incidente 5)
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "tienda"]
      interval: 1s
      retries: 60

  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/local-config.yaml
    ports: ["127.0.0.1:13100:3100"]

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alertas.yml:/etc/prometheus/alertas.yml:ro
    ports: ["127.0.0.1:19090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.28.0
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  receptor:
    image: python:3.13-slim
    command: ["python", "-u", "/r/receptor.py"]
    volumes: ["./config/receptor.py:/r/receptor.py:ro"]

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    volumes:
      - ./config/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
      - certs:/c:ro
    profiles: [certificado]

  web-tls:
    image: nginx:1.27-alpine
    networks:
      default:
        aliases: [api.tienda.test]
    volumes:
      - ./config/web-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/c:ro
    profiles: [certificado]

  # Incidente 4: dos réplicas detrás de un balanceador, para desplegar sin cortar.
  tienda-a:
    <<: *tienda
    environment: {<<: *entorno, NOMBRE: tienda-a, APAGADO: "${APAGADO:-}"}
    profiles: [despliegue]
  tienda-b:
    <<: *tienda
    environment: {<<: *entorno, NOMBRE: tienda-b, APAGADO: "${APAGADO:-}"}
    profiles: [despliegue]
  balanceador:
    image: nginx:1.27-alpine
    volumes: ["./config/balanceador-${BALANCEADOR:-ingenuo}.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:18080:80"]
    depends_on: [tienda-a, tienda-b]
    profiles: [despliegue]

volumes:
  certs:
