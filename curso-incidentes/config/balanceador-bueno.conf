# Si una réplica no contesta (se está apagando), se reintenta en la otra.
# Y `resolve`: al recrear una réplica cambia de IP, y sin esto nginx seguiría mandando a la vieja
# (la misma trampa de la lección 3 del curso de redes).
resolver 127.0.0.11 valid=1s;
upstream tienda {
  zone tienda 64k;
  server tienda-a:8000 resolve max_fails=1 fail_timeout=2s;
  server tienda-b:8000 resolve max_fails=1 fail_timeout=2s;
}
server {
  listen 80;
  location / {
    proxy_pass http://tienda;
    proxy_next_upstream error timeout http_502;
    proxy_next_upstream_tries 2;
    add_header X-Replica $upstream_addr always;
  }
}
