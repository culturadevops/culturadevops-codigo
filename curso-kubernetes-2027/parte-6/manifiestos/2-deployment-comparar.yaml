# Lo mismo con un Deployment, para comparar los nombres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deploy
spec:
  replicas: 3
  selector:
    matchLabels: {app: web-deploy}
  template:
    metadata:
      labels: {app: web-deploy}
    spec:
      containers:
        - name: web
          image: busybox:1.37
          command: ["sh", "-c", "sleep 3600"]
