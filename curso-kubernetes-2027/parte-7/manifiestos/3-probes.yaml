apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: k8s-b-api:1
          ports: [{containerPort: 8080}]
          readinessProbe:            # ¿le mando tráfico?
            httpGet: {path: /listo, port: 8080}
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:             # ¿lo reinicio?
            httpGet: {path: /salud, port: 8080}
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 8080}]
