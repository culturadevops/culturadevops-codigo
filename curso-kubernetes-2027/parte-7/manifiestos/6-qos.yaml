apiVersion: v1
kind: Pod
metadata: {name: qos-guaranteed}
spec:
  containers:
    - name: api
      image: k8s-b-api:1
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: 100m, memory: 64Mi}     # requests = limits
---
apiVersion: v1
kind: Pod
metadata: {name: qos-burstable}
spec:
  containers:
    - name: api
      image: k8s-b-api:1
      resources:
        requests: {cpu: 100m, memory: 64Mi}   # requests < limits
        limits: {memory: 256Mi}
---
apiVersion: v1
kind: Pod
metadata: {name: qos-besteffort}
spec:
  containers:
    - name: api
      image: k8s-b-api:1                     # sin requests ni limits
