apiVersion: v1
kind: Pod
metadata:
  name: con-sidecar
spec:
  initContainers:
    - name: preparar              # init clásico: corre una vez y termina
      image: busybox:1.37.0
      command: ["sh", "-c", "echo 'hola desde el pod' > /html/index.html"]
      volumeMounts:
        - name: html
          mountPath: /html
    - name: lector-logs           # sidecar nativo: init con restartPolicy Always
      image: busybox:1.37.0
      restartPolicy: Always
      command: ["sh", "-c", "touch /logs/access.log; tail -F /logs/access.log"]
      volumeMounts:
        - name: logs
          mountPath: /logs
  containers:
    - name: nginx
      image: nginx:1.29.8-alpine
      volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: logs
          mountPath: /var/log/nginx
  volumes:
    - name: html
      emptyDir: {}
    - name: logs
      emptyDir: {}
