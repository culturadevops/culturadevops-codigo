# Tres réplicas de nginx; cada una contesta con su propio nombre de pod.
# Lista mientras exista /usr/share/nginx/html/listo.html (readinessProbe).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.29.8-alpine
          command: ["sh", "-c"]
          args:
            - |
              echo "$HOSTNAME" > /usr/share/nginx/html/index.html
              touch /usr/share/nginx/html/listo.html
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /listo.html
              port: 80
            periodSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: cliente
spec:
  containers:
    - name: cliente
      image: busybox:1.37.0
      command: ["sleep", "3600"]
