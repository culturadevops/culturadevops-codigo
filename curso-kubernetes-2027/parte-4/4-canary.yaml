# Lo que el Ingress estándar no tiene: reparto por peso y por cabecera, sin anotaciones.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-canary
spec:
  parentRefs: [{name: entrada}]
  hostnames: [api.ejemplo.test]
  rules:
    - matches: [{headers: [{name: x-version, value: v2}]}]
      backendRefs: [{name: api-v2, port: 80}]
    - backendRefs:
        - {name: api, port: 80, weight: 90}
        - {name: api-v2, port: 80, weight: 10}
