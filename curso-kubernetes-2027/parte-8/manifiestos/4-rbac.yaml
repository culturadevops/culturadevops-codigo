# La API solo puede LEER ConfigMaps de su namespace. Nada más.
apiVersion: v1
kind: ServiceAccount
metadata: {name: api, namespace: tienda}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: leer-config, namespace: tienda}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: api-leer-config, namespace: tienda}
subjects:
  - {kind: ServiceAccount, name: api, namespace: tienda}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: leer-config
