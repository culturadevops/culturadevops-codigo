apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: tienda}
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      serviceAccountName: api
      containers:
        - name: api
          image: k8s-b-api:1
          ports: [{containerPort: 8080}]
          env:
            - name: MENSAJE
              valueFrom:
                configMapKeyRef: {name: api-config, key: MENSAJE}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: postgres-cred, key: DATABASE_URL}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          startupProbe:
            httpGet: {path: /salud, port: 8080}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:              # sin base de datos, fuera del Service
            httpGet: {path: /listo, port: 8080}
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:               # solo el proceso: la BD caída NO reinicia la API
            httpGet: {path: /salud, port: 8080}
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: tienda}
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api, namespace: tienda}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
