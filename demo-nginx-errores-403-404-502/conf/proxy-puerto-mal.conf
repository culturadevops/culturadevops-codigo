server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    error_log /var/log/nginx/demo-error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://app:8081/;
    }
}
