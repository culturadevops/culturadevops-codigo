input:
    job:
        command: update
        package-manager: npm_and_yarn
        allowed-updates:
            - update-type: all
        ignore-conditions:
            - dependency-name: express
              source: <repo>\pruebas-renovate-vs-dependabot\_dbot-npm_and_yarn.yaml
              version-requirement: '>5.3.0'
            - dependency-name: lodash
              source: <repo>\pruebas-renovate-vs-dependabot\_dbot-npm_and_yarn.yaml
              version-requirement: '>4.18.1'
