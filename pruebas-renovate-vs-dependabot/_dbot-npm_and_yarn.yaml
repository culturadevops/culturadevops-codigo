              version-requirement: '>1.20.0'
            - dependency-name: jest
              source: <repo>\pruebas-renovate-vs-dependabot\_dbot-npm_and_yarn.yaml
              version-requirement: '>30.5.2'
            - dependency-name: eslint
              source: <repo>\pruebas-renovate-vs-dependabot\_dbot-npm_and_yarn.yaml
              version-requirement: '>10.12.0'
        source:
            provider: github
            repo: lab/app
            directories:
                - /
            commit: 5b32fba5ca75eddd810e9be636f57786667b94ee
            hostname: github.com
            api-endpoint: https://api.github.com
