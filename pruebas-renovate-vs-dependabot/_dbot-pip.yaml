input:
    job:
        command: update
        package-manager: pip
        allowed-updates:
            - update-type: all
        ignore-conditions:
            - dependency-name: requests
              source: <repo>\pruebas-renovate-vs-dependabot\_dbot-pip.yaml
              version-requirement: '>2.34.2'
            - dependency-name: flask
              source: <repo>\pruebas-renovate-vs-dependabot\_dbot-pip.yaml
              version-requirement: '>3.1.3'
            - dependency-name: urllib3
              source: <repo>\pruebas-renovate-vs-dependabot\_dbot-pip.yaml
              version-requirement: '>2.8.0'
        source:
            provider: github
            repo: lab/app
            directories:
                - /
            commit: c06107f60443a5d96c19a3c0abd7043ccd4acc75
            hostname: github.com
            api-endpoint: https://api.github.com
output:
    - type: update_dependency_list
      expect:
        data:
            dependencies:
                - name: requests
                  requirements:
                    - file: requirements.txt
                      groups:
                        - dependencies
                      requirement: ==2.25.1
                      source: null
                  version: 2.25.1
                - name: flask
                  requirements:
                    - file: requirements.txt
                      groups:
                        - dependencies
                      requirement: ==1.1.2
                      source: null
                  version: 1.1.2
                - name: urllib3
                  requirements:
                    - file: requirements.txt
                      groups:
                        - dependencies
                      requirement: ==1.26.4
                      source: null
                  version: 1.26.4
            dependency_files:
                - /requirements.txt
    - type: create_pull_request
      expect:
        data:
            base-commit-sha: c06107f60443a5d96c19a3c0abd7043ccd4acc75
            dependencies:
                - name: requests
                  previous-requirements:
                    - file: requirements.txt
                      groups:
                        - dependencies
                      requirement: ==2.25.1
                      source: null
                  previous-version: 2.25.1
                  requirements:
                    - file: requirements.txt
                      groups:
                        - dependencies
                      requirement: ==2.34.2
                      source: null
                  version: 2.34.2
                  directory: /
            updated-dependency-files:
                - content: |
                    requests==2.34.2
                    flask==1.1.2
                    urllib3==1.26.4
                  content_encoding: utf-8
                  deleted: false
                  directory: /
                  name: requirements.txt
                  operation: update
                  support_file: false
                  type: file
            pr-title: bump requests from 2.25.1 to 2.34.2
            pr-body: Bumps [requests](https://github.com/psf/requests) from 2.25.1 to 2.34.2.
            commit-message: bump requests from 2.25.1 to 2.34.2
    - type: create_pull_request
      expect:
