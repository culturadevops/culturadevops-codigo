                  content_encoding: utf-8
                  deleted: false
                  directory: /
                  name: requirements.txt
                  operation: update
                  support_file: false
                  type: file
            pr-title: bump flask from 1.1.2 to 3.1.3
            pr-body: Bumps [flask](https://github.com/pallets/flask) from 1.1.2 to 3.1.3.
            commit-message: bump flask from 1.1.2 to 3.1.3
