            dependencies:
                - name: flask
                  previous-requirements:
                    - file: requirements.txt
                      groups:
                        - dependencies
                      requirement: ==1.1.2
                      source: null
                  previous-version: 1.1.2
                  requirements:
                    - file: requirements.txt
                      groups:
                        - dependencies
                      requirement: ==3.1.3
