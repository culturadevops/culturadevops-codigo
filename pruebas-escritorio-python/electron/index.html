<!doctype html><html><head><meta charset="utf-8"><title>Notas — Electron</title><style>
body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',sans-serif;margin:12px}
input{width:100%;box-sizing:border-box;background:#151b23;color:#e6edf3;border:0;padding:9px;font-size:15px}
button{border:0;padding:6px 16px;margin:8px 6px 8px 0;color:#fff;background:#238636}
button.b{background:#30363d;color:#e6edf3}
ul{list-style:none;padding:0;font-size:14px} li{background:#151b23;padding:6px 9px;margin:3px 0}
</style></head><body>
<input id="caja" placeholder="una nota y Enter">
<div><button onclick="agregar()">Agregar</button><button class="b" onclick="borrar()">Borrar</button></div>
<ul id="lista"></ul>
<script>
const notas = JSON.parse(localStorage.getItem('notas') || '[]');
const pinta = () => { document.getElementById('lista').innerHTML =
  notas.map((n, i) => `<li onclick="sel=${i}">${n}</li>`).join(''); };
let sel = -1;
function agregar(){ const c = document.getElementById('caja');
  if (c.value.trim()) { notas.push(c.value.trim()); c.value = '';
    localStorage.setItem('notas', JSON.stringify(notas)); pinta(); } }
function borrar(){ if (sel >= 0) { notas.splice(sel, 1); sel = -1;
    localStorage.setItem('notas', JSON.stringify(notas)); pinta(); } }
document.getElementById('caja').addEventListener('keydown', e => { if (e.key === 'Enter') agregar(); });
pinta();
</script></body></html>
