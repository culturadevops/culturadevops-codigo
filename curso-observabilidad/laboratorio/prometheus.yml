global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alertas.yml
  - /etc/prometheus/reglas-registro.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: tienda
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: fantasma
    static_configs:
      - targets: ["host.docker.internal:9999"]

  - job_name: maquina
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: contenedores
    static_configs:
      - targets: ["cadvisor:8080"]
