# HAProxy 3.4 — lo mismo que los demás: /api a backend:9000, HTTP en 8080 y HTTPS en 8443 con el MISMO certificado.
# 2 hilos = las 2 CPU del contenedor (sin fijarlo vería los 24 hilos de la máquina). Sin log de accesos.
# HAProxy no sirve archivos estáticos: en «¿HAProxy o Nginx?» solo se mide el proxy.
global
    nbthread 2
    maxconn 20000

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option http-keep-alive
    option forwardfor

frontend entrada
    bind :8080
    bind :8443 ssl crt /etc/certs/haproxy.pem
    default_backend be

backend be
    server b1 backend:9000
