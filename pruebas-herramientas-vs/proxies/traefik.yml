# Traefik 3.7 — configuración estática. Las rutas van en dinamica.yml (proveedor de archivo: en el banco no hay etiquetas de
# Docker ni socket montado, para medir solo el proxy). Sin registro de accesos (de fábrica), log solo de errores.
entryPoints:
  web:
    address: ":8080"
  websecure:
    address: ":8443"
providers:
  file:
    filename: /etc/traefik/dinamica.yml
# igualado con los demás: pool de 1024 conexiones ociosas al backend (de fábrica, 200: ver traefik-fabrica.yml)
serversTransport:
  maxIdleConnsPerHost: 1024
log:
  level: ERROR
