# Nginx 1.30 — configuración de producción razonable, igualada con los otros proxies (ver proxies.py):
#   · 2 procesos de trabajo = las 2 CPU del contenedor («auto» vería los 24 hilos de la máquina);
#   · sin registro de accesos (Caddy, Traefik y HAProxy no registran por defecto);
#   · conexiones persistentes al backend con un pool de 1024 en TODOS (Nginx keepalive 1024; Caddy keepalive_idle_conns_per_host
#     1024; Traefik maxIdleConnsPerHost 1024; HAProxy no tiene tope de fábrica). Lo de fábrica de cada uno: *-fabrica.*
worker_processes 2;
pid /tmp/nginx.pid;
events { worker_connections 8192; }
http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_requests 100000;
    include /etc/nginx/mime.types;
    upstream backend {
        server backend:9000;
        keepalive 1024;
    }
    server {
        listen 8080;
        listen 8443 ssl;
        ssl_certificate     /etc/certs/cert.pem;
        ssl_certificate_key /etc/certs/key.pem;
        location /static/ {
            root /srv/www;
        }
        location /api {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
