# Configuración de Loki para el banco de pruebas del vídeo 229.
#
# ⚠️ SOLO SE TOCAN DOS COSAS respecto a la de serie, y las dos son barreras de configuración,
#    NO propiedades del diseño de Loki. Se dicen en el vídeo para que nadie piense que se hizo
#    trampa:
#
#  1. `chunk_idle_period` / `max_chunk_age` a segundos. Por defecto Loki tiene los trozos en
#     memoria hasta media hora; medir el disco antes de que los vuelque daría kilobytes.
#
#  2. Los límites de ritmo de ingesta, arriba. Con los de serie (4 MB/s) Loki devolvía 429 a
#     mitad de la carga y solo entraba parte del corpus: la comparación no valdría nada.
auth_enabled: false
server: { http_listen_port: 3100 }
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem: { chunks_directory: /loki/chunks, rules_directory: /loki/rules }
  replication_factor: 1
  ring: { kvstore: { store: inmemory } }
schema_config:
  configs:
    - from: 2020-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index: { prefix: index_, period: 24h }
ingester:
  chunk_idle_period: 5s
  max_chunk_age: 15s
limits_config:
  reject_old_samples: false
  allow_structured_metadata: false
  ingestion_rate_mb: 256
  ingestion_burst_size_mb: 512
  per_stream_rate_limit: 256MB
  per_stream_rate_limit_burst: 512MB
  max_streams_per_user: 0
  max_global_streams_per_user: 0
