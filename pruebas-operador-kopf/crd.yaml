apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: paginawebs.web.culturadevops.dev
spec:
  group: web.culturadevops.dev
  scope: Namespaced
  names:
    kind: PaginaWeb
    plural: paginawebs
    singular: paginaweb
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Replicas, type: integer, jsonPath: .spec.replicas}
        - {name: Listas, type: integer, jsonPath: .status.listas}
        - {name: Mensaje, type: string, jsonPath: .spec.mensaje}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [mensaje]
              properties:
                replicas: {type: integer, minimum: 1, maximum: 10, default: 1}
                mensaje: {type: string, maxLength: 200}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
